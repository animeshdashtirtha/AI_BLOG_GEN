<script>
    /**
     * Dark/Light Mode Toggle
     * Syncs both desktop and mobile toggle buttons.
     * Persists preference in localStorage.
     */
    (function() {
        const html = document.documentElement;
        const toggles = document.querySelectorAll('#theme-toggle, #theme-toggle-mobile');

        function setTheme(isDark) {
            if (isDark) {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
            localStorage.setItem('theme', isDark ? 'dark' : 'light');

            // Update aria-checked on all toggle buttons
            toggles.forEach(btn => {
                if (btn) btn.setAttribute('aria-checked', isDark.toString());
            });
        }

        function toggleTheme() {
            const isDark = html.classList.contains('dark');
            setTheme(!isDark);
        }

        // Attach click handlers to all theme toggle buttons
        toggles.forEach(btn => {
            if (btn) btn.addEventListener('click', toggleTheme);
        });

        // Listen for OS-level preference changes
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        mq.addEventListener('change', (e) => {
            // Only auto-switch if user hasn't explicitly set a preference
            if (localStorage.getItem('theme') === null) {
                setTheme(e.matches);
            }
        });

        // Initialize aria-checked on load
        const isDark = html.classList.contains('dark');
        toggles.forEach(btn => {
            if (btn) btn.setAttribute('aria-checked', isDark.toString());
        });
    })();
</script>
