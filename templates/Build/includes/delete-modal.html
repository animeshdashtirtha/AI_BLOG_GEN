{# Delete confirmation modal — shared between blog-list and blog-details #}
<div id="delete-modal-overlay" class="modal-overlay" aria-hidden="true" role="alertdialog" aria-modal="true" aria-labelledby="delete-modal-title" aria-describedby="delete-modal-message">
    <div class="modal-card">
        <div class="modal-icon-circle">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
            </svg>
        </div>
        <h2 id="delete-modal-title" class="modal-title">Delete Blog?</h2>
        <p class="modal-message" id="delete-modal-message">
            Are you sure you want to delete this blog post? This action cannot be undone.
        </p>
        <div class="modal-actions">
            <button id="delete-modal-cancel" class="btn btn-secondary" autofocus>
                Cancel
            </button>
            <button id="delete-modal-confirm" class="btn btn-danger">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                Delete
            </button>
        </div>
    </div>
</div>
